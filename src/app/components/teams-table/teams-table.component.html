<table class="table">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">name</th>
      <th scope="col">Owner</th>
      <th scope="col">Foundation</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let obj of teamsTab">

      <td>{{obj.name}}</td>

    </tr>

  </tbody>
</table>
